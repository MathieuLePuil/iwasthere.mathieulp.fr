framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    # Un worker tué en plein traitement (typiquement un cache:clear
                    # de déploiement qui lui retire ses fichiers de conteneur) laisse
                    # le message réservé. Passé ce délai il redevient consommable :
                    # une notification n'attend donc que quelques minutes, pas l'heure
                    # que vaut le défaut de Doctrine.
                    redeliver_timeout: 300
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            App\Message\SendPushNotification: async
            # Appels HTTP sortants (setlist.fm avec ses attentes sur 429, Deezer) :
            # jamais dans la requête qui crée l'événement.
            App\Message\ImportSetlistMessage: async
            App\Message\FetchArtistImageMessage: async
