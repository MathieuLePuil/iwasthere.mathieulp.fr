# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    setlistfm_api_key: '%env(default::SETLISTFM_API_KEY)%'
    vapid_public_key: '%env(default::VAPID_PUBLIC_KEY)%'
    vapid_private_key: '%env(default::VAPID_PRIVATE_KEY)%'
    vapid_subject: '%env(default::VAPID_SUBJECT)%'
    ticketmaster_api_key: '%env(default:ticketmaster_api_key_default:TICKETMASTER_API_KEY)%'
    ticketmaster_api_key_default: ''
    # Segments du catalogue gardés par la synchronisation, en plus de ceux déjà
    # suivis par une veille active. « all » pour tout le flux (~61 000 événements).
    ticketmaster_segments: '%env(default:ticketmaster_segments_default:TICKETMASTER_SEGMENTS)%'
    ticketmaster_segments_default: 'Music'
    # Lot 3, mode « journalisation seule » : les échéances sont consignées à
    # l'heure prévue au lieu d'être envoyées — pour vérifier le calage sur
    # quelques ouvertures réelles avant d'alerter les utilisateurs.
    ticketmaster_alerts_log_only: '%env(bool:default::TICKETMASTER_ALERTS_LOG_ONLY)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\SetlistFmService:
        arguments:
            $apiKey: '%setlistfm_api_key%'

    App\Service\NotificationService:
        arguments:
            $vapidPublicKey: '%vapid_public_key%'
            $vapidPrivateKey: '%vapid_private_key%'
            $vapidSubject: '%vapid_subject%'

    App\Ticketmaster\FeedDownloader:
        arguments:
            $apiKey: '%ticketmaster_api_key%'
